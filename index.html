    <style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{

height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at top,#062939 0%,#020305 60%,#000 100%);
color:white;
position:relative;

}

/* Background Glow */

body::before{

content:"";
position:absolute;
width:650px;
height:650px;
border-radius:50%;
background:#00eaff22;
filter:blur(120px);
animation:pulse 6s ease-in-out infinite;

}

@keyframes pulse{

50%{
transform:scale(1.15);
opacity:.8;
}

}

/* Grid */

.grid{

position:absolute;
inset:0;

background:
linear-gradient(#00d8ff10 1px,transparent 1px),
linear-gradient(90deg,#00d8ff10 1px,transparent 1px);

background-size:50px 50px;

mask-image:linear-gradient(to bottom,transparent,black 30%,black);

}

/* Floating particles */

.particle{

position:absolute;
width:3px;
height:3px;
background:#57efff;
border-radius:50%;
box-shadow:0 0 12px #57efff;
opacity:.7;
animation:float linear infinite;

}

@keyframes float{

from{

transform:translateY(100vh);

}

to{

transform:translateY(-100px);

}

}

.wrapper{

z-index:5;
text-align:center;
padding:20px;
max-width:700px;

}

/* Logo */

.logo-wrap{

display:inline-block;
perspective:1000px;

}

.logo{

width:170px;
max-width:45vw;
filter:
drop-shadow(0 0 10px #00eaff)
drop-shadow(0 0 30px #00eaff);

animation:
floating 4s ease-in-out infinite;

transition:
transform .18s ease;

transform-style:preserve-3d;

}

@keyframes floating{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-18px);

}

}

h1{

margin-top:35px;
font-size:clamp(2rem,5vw,4rem);
font-weight:800;
letter-spacing:-1px;

}

.highlight{

color:#49ecff;
text-shadow:
0 0 10px #00dfff,
0 0 20px #00dfff;

}

p{

margin:22px auto;
max-width:600px;
font-size:1.05rem;
line-height:1.8;
color:#b4cbd4;

}

.small{

margin-top:12px;
font-size:.9rem;
color:#7f98a3;

}

/* Button */

.button{

margin-top:55px;
display:inline-flex;
align-items:center;
justify-content:center;

padding:16px 42px;

text-decoration:none;
font-weight:700;

color:#00eaff;

border:2px solid #00eaff;

border-radius:50px;

background:#00eaff08;

backdrop-filter:blur(10px);

box-shadow:

0 0 12px #00dfff,

0 0 30px #00dfff55,

inset 0 0 10px #00dfff44;

transition:.35s;

position:relative;

overflow:hidden;

}

.button::before{

content:"";

position:absolute;

left:-120%;

width:60%;

height:100%;

background:

linear-gradient(
90deg,
transparent,
#ffffff88,
transparent);

transform:skewX(-20deg);

transition:.6s;

}

.button:hover{

transform:translateY(-5px);

background:#00eaff;

color:#02171d;

box-shadow:

0 0 25px #00eaff,

0 0 55px #00eaff,

0 0 100px #00eaff;

}

.button:hover::before{

left:160%;

}

@media(max-width:600px){

.logo{

width:135px;

}

p{

font-size:.95rem;

}

.button{

width:100%;

}

}

View All Security Projects →

<script>

// Generate particles

for(let i=0;i<45;i++){

const p=document.createElement("span");

p.className="particle";

p.style.left=Math.random()*100+"vw";

p.style.animationDuration=(8+Math.random()*8)+"s";

p.style.animationDelay=Math.random()*8+"s";

document.body.appendChild(p);

}

// Logo Tilt

const logo=document.getElementById("logo");

document.addEventListener("mousemove",(e)=>{

const x=(e.clientX/window.innerWidth-.5)*18;

const y=(e.clientY/window.innerHeight-.5)*18;

logo.style.transform=
`rotateY(${x}deg)
 rotateX(${-y}deg)
 translateY(-5px)`;

});

document.addEventListener("mouseleave",()=>{

logo.style.transform="rotateX(0) rotateY(0)";

});

</script>
